name: extract-published-figure4-point

on:
  push:
    branches: ["run/zenodo-7870795"]
    paths:
      - "scripts/extract_published_fig4_point.py"
      - ".github/workflows/published-fig4-point.yml"
  workflow_dispatch:

permissions: {contents: write}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install numpy scipy h5py matplotlib requests
      - name: Download verified processed volumes and extract published point
        run: |
          set -o pipefail
          mkdir -p reports/published_fig4_point
          python scripts/extract_published_fig4_point.py 2>&1 | tee reports/published_fig4_point/runner.log
      - name: Publish compact evidence
        if: always()
        run: |
          rm -rf .cache
          find reports/published_fig4_point -type f -size +20M -delete
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/published_fig4_point
          if ! git diff --cached --quiet;then git commit -m "test: record published full-volume Figure-4 point evidence [skip ci]";git pull --rebase origin "${GITHUB_REF_NAME}";git push origin "HEAD:${GITHUB_REF_NAME}";fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: published-figure4-point, path: reports/published_fig4_point, retention-days: 30}
