name: posterior-miscalibration-audit

on:
  push:
    branches: ["run/zenodo-7870795"]
    paths:
      - "scripts/run_posterior_miscalibration_audit.py"
      - "src/seoct_uncertainty/**"
      - ".github/workflows/posterior-miscalibration-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib
      - name: Run posterior-miscalibration audit
        env: {PYTHONPATH: src}
        run: python scripts/run_posterior_miscalibration_audit.py | tee posterior_miscalibration.log
      - name: Validate evidence fail-closed
        run: |
          python scripts/validate_evidence_bundle.py --metrics reports/posterior_miscalibration_audit/metrics.json --output reports/posterior_miscalibration_audit/EVIDENCE_STATUS.json --required-key status --required-key rows --required-key curves --required-key decisions
      - name: Record provenance
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path('reports/posterior_miscalibration_audit/provenance.json')
          p.write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'VERIFIED_SYNTHETIC','boundary':'Synthetic misspecification scenarios; not authors actual error.'},indent=2),encoding='utf-8')
          PY
          mv posterior_miscalibration.log reports/posterior_miscalibration_audit/run.log
      - name: Commit verified evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add reports/posterior_miscalibration_audit
          if ! git diff --cached --quiet; then
            git commit -m "test: record verified posterior-miscalibration evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
