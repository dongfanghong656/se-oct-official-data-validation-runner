name: extract-reusable-official-tio2-crop

on:
  push:
    branches: ["run/zenodo-7870795"]
    paths:
      - "scripts/extract_official_crop.py"
      - ".github/workflows/extract-crop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install numpy scipy requests
      - name: Download, verify, and extract crop
        run: python scripts/extract_official_crop.py 2>&1 | tee /tmp/extract-crop.log
      - name: Commit reusable crop
        run: |
          rm -rf .cache
          cp /tmp/extract-crop.log reports/extracts/extract_crop.log
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/extracts/official_tio2_crop_97.mat reports/extracts/official_tio2_crop_97_manifest.json reports/extracts/extract_crop.log
          if ! git diff --cached --quiet; then
            git commit -m "data: add reusable checksum-verified TiO2 crop [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - uses: actions/upload-artifact@v4
        with: {name: official-tio2-crop-97, path: reports/extracts/official_tio2_crop_97.*, retention-days: 30}
