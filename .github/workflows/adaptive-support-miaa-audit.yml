name: uncertainty-adaptive-miaa-support-audit

on:
  push:
    branches: ["run/zenodo-7870795"]
    paths:
      - "scripts/uncertainty_miaa_audit.py"
      - "scripts/adaptive_support_miaa_audit.py"
      - ".github/workflows/adaptive-support-miaa-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uncertainty-adaptive-miaa-support-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy scipy pandas matplotlib
      - name: Run adaptive-support causal audit
        run: |
          set -o pipefail
          rm -rf reports/adaptive_support
          python scripts/adaptive_support_miaa_audit.py \
            2>&1 | tee reports/adaptive_support/execution.log
      - name: Fail-closed evidence validation
        run: |
          python scripts/validate_evidence_bundle.py \
            --metrics reports/adaptive_support/metrics.json \
            --output reports/adaptive_support/EVIDENCE_STATUS.json \
            --required-key status \
            --required-key configuration \
            --required-key decisions \
            --required-key summary
      - name: Record provenance
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          root = pathlib.Path("reports/adaptive_support")
          metrics = root / "metrics.json"
          root.joinpath("provenance.json").write_text(json.dumps({
            "schema": "adaptive-support-provenance-v1",
            "source_commit": os.environ.get("GITHUB_SHA"),
            "run_id": os.environ.get("GITHUB_RUN_ID"),
            "metrics_sha256": hashlib.sha256(metrics.read_bytes()).hexdigest(),
            "recorded_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "boundary": "Synthetic normalized-spectrum audit; confidence gates do not replace independent physical wideband validation."
          }, indent=2), encoding="utf-8")
          PY
      - name: Commit verified compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add reports/adaptive_support
          if ! git diff --cached --quiet; then
            git commit -m "test: record verified uncertainty-adaptive support evidence [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
