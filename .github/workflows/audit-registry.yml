name: build-audit-registry

on:
  push:
    branches: ["run/zenodo-7870795"]
    paths:
      - "scripts/build_audit_registry.py"
      - "docs/AUDIT_OVERRIDES.json"
      - "docs/SCIENTIFIC_CLAIM_MATRIX.md"
      - ".github/workflows/audit-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Build fail-closed registry
        run: python scripts/build_audit_registry.py
      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          python scripts/build_audit_registry.py
          git add reports/AUDIT_REGISTRY.json reports/AUDIT_REGISTRY.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh audit registry [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
