name: uncertainty-aware-miaa-audit

on:
  push:
    branches: ["run/zenodo-7870795"]
    paths:
      - "src/seoct_uncertainty/**"
      - "tests/test_conditional_miaa.py"
      - "scripts/run_uncertainty_audit.py"
      - "docs/UNCERTAINTY_AWARE_MIAA_SPEC.md"
      - ".github/workflows/uncertainty-aware-miaa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: python -m pip install numpy scipy matplotlib pytest
      - name: Unit tests
        env: {PYTHONPATH: src}
        run: pytest tests/test_conditional_miaa.py -q | tee reports_uncertainty_pytest.log
      - name: Run uncertainty audit
        env: {PYTHONPATH: src}
        run: python scripts/run_uncertainty_audit.py | tee reports_uncertainty_run.log
      - name: Validate evidence fail-closed
        run: |
          python scripts/validate_evidence_bundle.py \
            --metrics reports/uncertainty_audit/uncertainty_audit_metrics.json \
            --output reports/uncertainty_audit/EVIDENCE_STATUS.json \
            --required-key status \
            --required-key missing_band_metrics \
            --required-key posterior_variance_calibration \
            --required-key profile_metrics
      - name: Record provenance
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path('reports/uncertainty_audit/provenance.json')
          p.write_text(json.dumps({
            'source_commit':os.environ['GITHUB_SHA'],
            'run_id':os.environ['GITHUB_RUN_ID'],
            'recorded_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'status':'VERIFIED_SYNTHETIC',
            'boundary':'Known-power synthetic Gaussian audit; not physical wideband validation.'
          },indent=2),encoding='utf-8')
          PY
          mv reports_uncertainty_pytest.log reports/uncertainty_audit/pytest.log
          mv reports_uncertainty_run.log reports/uncertainty_audit/run.log
      - name: Commit verified compact evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add reports/uncertainty_audit
          if ! git diff --cached --quiet; then
            git commit -m "test: record verified uncertainty-aware MIAA audit [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
