name: extract-figure5-parameters

on:
  push:
    branches: ["run/zenodo-7870795"]
    paths: [".github/workflows/leaf-figure-params.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download and verify plotting script
        run: |
          mkdir -p /tmp/upstream reports/source_ranges
          curl -fL --retry 5 --retry-all-errors -o /tmp/upstream/plot_figure5.m "https://zenodo.org/records/7870795/files/plot_figure5.m?download=1"
          echo "bb5ad4827fb659e3e2d6552990829d1f  /tmp/upstream/plot_figure5.m" | md5sum -c -
          {
            echo '# plot_figure5.m coordinate and display parameters'
            echo
            grep -nE 'Ascan|[XYZ](index|ind)|xlim|ylim|zlim|roi|ROI|methods|dBlim|images\{' /tmp/upstream/plot_figure5.m || true
          } > reports/source_ranges/plot_figure5_parameters.txt
      - name: Commit parameter audit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/source_ranges/plot_figure5_parameters.txt
          if ! git diff --cached --quiet; then git commit -m "docs: record figure-5 coordinate parameters [skip ci]"; git pull --rebase origin "${GITHUB_REF_NAME}"; git push origin "HEAD:${GITHUB_REF_NAME}"; fi
