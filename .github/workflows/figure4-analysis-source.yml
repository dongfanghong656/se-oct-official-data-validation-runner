name: extract-figure4-analysis-source
on:
  push:
    branches: ["run/zenodo-7870795"]
    paths: [".github/workflows/figure4-analysis-source.yml"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Download, verify, and extract source
        run: |
          mkdir -p /tmp/upstream reports/source_ranges
          curl -fL --retry 6 --retry-all-errors -o /tmp/upstream/resolution_analysis_figure4.m "https://zenodo.org/records/7870795/files/resolution_analysis_figure4.m?download=1"
          echo "6813cf1ea431e5823432ba30dd2a1302  /tmp/upstream/resolution_analysis_figure4.m"|md5sum -c -
          {
            echo '# resolution_analysis_figure4.m — verified source audit'
            echo; echo '```matlab'
            nl -ba /tmp/upstream/resolution_analysis_figure4.m
            echo '```'
          } > reports/source_ranges/resolution_analysis_figure4.md
      - name: Commit source audit
        run: |
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/source_ranges/resolution_analysis_figure4.md
          if ! git diff --cached --quiet;then git commit -m "docs: record exact Figure-4 selection source [skip ci]";git pull --rebase origin "${GITHUB_REF_NAME}";git push origin "HEAD:${GITHUB_REF_NAME}";fi
