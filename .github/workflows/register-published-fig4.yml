name: register-published-figure4-crops
on:
  push:
    branches: ["run/zenodo-7870795"]
    paths:
      - "scripts/register_published_fig4_crops.py"
      - ".github/workflows/register-published-fig4.yml"
      - "reports/published_fig4_point/*_crop.npz"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python -m pip install numpy scipy matplotlib
      - run: python scripts/register_published_fig4_crops.py 2>&1|tee reports/published_fig4_point/registration.log
      - name: Commit evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/published_fig4_point
          if ! git diff --cached --quiet;then git commit -m "test: register same published Figure-4 point [skip ci]";git pull --rebase origin "${GITHUB_REF_NAME}";git push origin "HEAD:${GITHUB_REF_NAME}";fi
