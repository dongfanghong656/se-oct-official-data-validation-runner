name: exact-figure4-coordinate-crop-validation
on:
  push:
    branches: ["run/zenodo-7870795"]
    paths:
      - "scripts/run_exact_fig4_crop.m"
      - "scripts/analyze_exact_fig4_crop.py"
      - ".github/workflows/exact-fig4-crop.yml"
      - "reports/extracts/official_tio2_fig4_outfocus_crop.mat"
  workflow_dispatch:
permissions: {contents: write}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          sudo apt-get update -qq;sudo apt-get install -y --no-install-recommends octave octave-signal
          python -m pip install numpy scipy matplotlib
      - name: Verify crop and get exact author functions
        run: |
          mkdir -p .cache/upstream reports/exact_fig4_crop
          python - <<'PY'
          import hashlib,json,pathlib
          m=json.load(open('reports/extracts/official_tio2_crops_manifest.json'));c=[x for x in m['crops'] if x['crop_file']=='official_tio2_fig4_outfocus_crop.mat'][0];p=pathlib.Path('reports/extracts')/c['crop_file'];h=hashlib.sha256(p.read_bytes()).hexdigest();assert h==c['crop_sha256'],(h,c['crop_sha256'])
          PY
          for spec in "fiaa_oct_c1.m 4839b0a7a57a7abe73f6644e38249cc6" "rec_fiaa_oct_c1.m 08133e8bc4e62063149474cd402990d2";do set -- $spec;curl -fL --retry 6 --retry-all-errors -o ".cache/upstream/$1" "https://zenodo.org/records/7870795/files/$1?download=1";echo "$2  .cache/upstream/$1"|md5sum -c -;done
      - name: Exact author FIAA/MIAA
        env:
          DATA_FILE: ${{ github.workspace }}/reports/extracts/official_tio2_fig4_outfocus_crop.mat
          UPSTREAM_CODE_DIR: ${{ github.workspace }}/.cache/upstream
          OUTPUT_MAT: ${{ github.workspace }}/reports/exact_fig4_crop/crop.mat
        run: |
          set -o pipefail;octave-cli --quiet scripts/run_exact_fig4_crop.m 2>&1|tee reports/exact_fig4_crop/octave.log
      - name: 3-D ISAM and phase causal test
        run: |
          set -o pipefail;python scripts/analyze_exact_fig4_crop.py reports/exact_fig4_crop/crop.mat reports/exact_fig4_crop 2>&1|tee reports/exact_fig4_crop/analysis.log
      - name: Publish compact evidence
        if: always()
        run: |
          rm -rf .cache;rm -f reports/exact_fig4_crop/crop.mat
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/exact_fig4_crop
          if ! git diff --cached --quiet;then git commit -m "test: record coordinate-correct figure-4 crop evidence [skip ci]";git pull --rebase origin "${GITHUB_REF_NAME}";git push origin "HEAD:${GITHUB_REF_NAME}";fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: exact-figure4-crop, path: reports/exact_fig4_crop, retention-days: 30}
